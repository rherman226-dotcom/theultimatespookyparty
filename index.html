<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Halloween 2026: The Ultimate Spooky Party</title>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #000;
    }

    body {
      background: url("halloween-background.png") center center / cover no-repeat fixed;
      font-family: Arial, sans-serif;
    }

    .player {
      position: fixed;
      left: 50%;
      bottom: 4vh;
      transform: translateX(-50%);
      width: min(720px, 88vw);
      aspect-ratio: 16 / 9;
      box-shadow: 0 8px 30px rgba(0,0,0,.75);
      border: 2px solid rgba(255,255,255,.35);
      border-radius: 10px;
      overflow: hidden;
      background: #000;
    }

    #player {
      width: 100%;
      height: 100%;
    }

    @media (max-width: 700px) {
      .player {
        bottom: 2vh;
        width: 94vw;
      }
    }
  </style>
</head>
<body>
  <div class="player">
    <div id="player"></div>
  </div>

  <script>
    const PLAYLIST_ID = "PLPpXqXEr01uYSO_LvTFXDI5Vs04M-8QAY";

    let ytPlayer;

    function onYouTubeIframeAPIReady() {
      ytPlayer = new YT.Player("player", {
        width: "100%",
        height: "100%",
        playerVars: {
          listType: "playlist",
          list: PLAYLIST_ID,
          rel: 0,
          playsinline: 1
        },
        events: {
          onReady: startRadioStylePlayback
        }
      });
    }

    function startRadioStylePlayback(event) {
      const player = event.target;

      // YouTube exposes the playlist after it has loaded.
      // Shuffle it, then choose a random starting position.
      const playlist = player.getPlaylist();

      if (playlist && playlist.length) {
        player.setShuffle(true);
        const randomIndex = Math.floor(Math.random() * playlist.length);
        player.playVideoAt(randomIndex);
      }
    }
  </script>

  <script src="https://www.youtube.com/iframe_api"></script>
</body>
</html>

</body>
</html>

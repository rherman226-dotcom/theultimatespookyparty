<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Halloween 2026: The Ultimate Spooky Party</title>

  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #000;
    }

    body {
      background: url("halloween-background.png") center center / cover no-repeat fixed;
      font-family: Arial, sans-serif;
    }

    .player {
  position: fixed;
  width: 160px;
  height: 90px;
  top: 15px;
  right: 15px;
  z-index: 10;
}

#player {
  width: 100%;
  height: 100%;
}

    #player {
      width: 100%;
      height: 100%;
    }

    @media (max-width: 700px) {
      .player {
        width: 70vw;
      }
    }
  </style>
</head>

<body>

  <div class="player">
    <div id="player"></div>
  </div>

  <script>
    const PLAYLIST_ID = "PLPpXqXEr01uYSO_LvTFXDI5Vs04M-8QAY";

    let ytPlayer;

    function onYouTubeIframeAPIReady() {

      ytPlayer = new YT.Player("player", {

        width: "100%",
        height: "100%",

        playerVars: {
          listType: "playlist",
          list: PLAYLIST_ID,
          rel: 0,
          playsinline: 1
        },

        events: {
          onReady: startRadioStylePlayback,
          onError: skipUnavailableVideo,
          onStateChange: onPlayerStateChange
        }

      });
    }


    function startRadioStylePlayback(event) {

      const player = event.target;

      // Turn playlist shuffle on.
      player.setShuffle(true);

      // Give YouTube time to load the playlist.
      setTimeout(function() {

        const playlist = player.getPlaylist();

        if (playlist && playlist.length) {

          // Start with a different random song each time.
          const randomIndex =
            Math.floor(Math.random() * playlist.length);

          player.playVideoAt(randomIndex);
        }

      }, 1000);
    }


    function skipUnavailableVideo(event) {

      console.log(
        "Video unavailable. Skipping to the next song."
      );

      // Move to the next song instead of stopping the radio.
      setTimeout(function() {

        if (ytPlayer) {
          ytPlayer.nextVideo();
        }

      }, 500);
    }


    function onPlayerStateChange(event) {

      // If a song finishes normally, continue to the next song.
      if (event.data === YT.PlayerState.ENDED) {

        setTimeout(function() {

          if (ytPlayer) {
            ytPlayer.nextVideo();
          }

        }, 300);
      }
    }

  </script>

  <script src="https://www.youtube.com/iframe_api"></script>

</body>
</html>

<body>

  <div class="player">
    <div id="player"></div>
  </div>

  <div class="now-playing">
    <div class="song-title" id="songTitle">Now Playing</div>
    <div class="artist" id="artistName"></div>
  </div>

  <script>
    const PLAYLIST_ID = "PLPpXqXEr01uYSO_LvTFXDI5Vs04M-8QAY";

    let ytPlayer;

    function onYouTubeIframeAPIReady() {
      ytPlayer = new YT.Player("player", {
        width: "100%",
        height: "100%",
        playerVars: {
          listType: "playlist",
          list: PLAYLIST_ID,
          rel: 0,
          playsinline: 1
        },
        events: {
          onReady: startRadioStylePlayback,
          onError: skipUnavailableVideo,
          onStateChange: onPlayerStateChange
        }
      });
    }

    function startRadioStylePlayback(event) {
      const player = event.target;

      player.setShuffle(true);

      setTimeout(function() {
        const playlist = player.getPlaylist();

        if (playlist && playlist.length) {
          const randomIndex =
            Math.floor(Math.random() * playlist.length);

          player.playVideoAt(randomIndex);
        }
      }, 1000);
    }

    function updateNowPlaying() {
      if (!ytPlayer) return;

      const title = ytPlayer.getVideoData().title;

      if (!title) return;

      document.getElementById("songTitle").textContent = title;
    }

    function skipUnavailableVideo(event) {
      console.log("Video unavailable. Skipping to the next song.");

      setTimeout(function() {
        if (ytPlayer) {
          ytPlayer.nextVideo();
        }
      }, 500);
    }

    function onPlayerStateChange(event) {
      if (event.data === YT.PlayerState.PLAYING) {
        updateNowPlaying();
      }

      if (event.data === YT.PlayerState.ENDED) {
        setTimeout(function() {
          if (ytPlayer) {
            ytPlayer.nextVideo();
          }
        }, 300);
      }
    }
  </script>

  <script src="https://www.youtube.com/iframe_api"></script>

</body>
